<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>عدّاء المترو بيكسل</title><style>
:root{color-scheme:dark;--ac:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#0b0b16;color:#fff;font-family:Tahoma,Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#w{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);container-type:size}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2cqw;background:#000b;font-size:4.4cqw;text-align:center;padding:3cqw;overflow:auto}
h1{font-size:9cqw;margin:0;color:var(--ac);text-shadow:.8cqw .8cqw #e63946,1.6cqw 1.6cqw #000}

button{font:inherit;background:var(--ac);color:#222;border:0;border-bottom:.8cqw solid #b8860b;padding:1.4cqw 5cqw;border-radius:1.5cqw;cursor:pointer;font-weight:bold}
button:disabled{background:#555;border-color:#333;color:#aaa}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;width:94%}
.it{background:#1d2144;border:.5cqw solid #3a3f80;border-radius:2cqw;padding:2cqw;display:flex;flex-direction:column;gap:1.2cqw;align-items:center;font-size:3.6cqw}
.it.on{border-color:var(--ac)}.sw{display:flex}.sw i{width:5cqw;height:5cqw}
#hbb{position:absolute;bottom:3cqw;left:3cqw;display:none;font-size:3.6cqw}
#pz{position:absolute;top:2cqw;left:50%;display:none;transform:translateX(-50%);font-size:3cqw;padding:.5cqw 3cqw}
</style></head><body><div id="w"><canvas id="c"></canvas>
<button id="hbb" onclick="board()">H</button><button id="pz" onclick="pause()">⏸</button>
<div class="ov" id="menu"><h1>عدّاء المترو<br>بيكسل</h1><div id="mi"></div><button onclick="play()">▶ ابدأ اللعب</button><button onclick="openStore()">🛒 المتجر</button><button onclick="mute=!mute;this.textContent=mute?'🔇 الصوت مغلق':'🔊 الصوت يعمل'">🔊 الصوت يعمل</button>
<div style="font-size:3.2cqw;line-height:1.7">← → تغيير المسار · ↑ قفز · ↓ انزلاق<br>H تشغيل لوح التزلج · P إيقاف مؤقت<br>على الهاتف: اسحب بالإصبع</div></div>
<div class="ov" id="store"></div>
<div class="ov" id="over"></div>
<div class="ov" id="paus"><h2>إيقاف مؤقت</h2><button onclick="pause()">متابعة</button><button onclick="toMenu()">القائمة</button></div></div>
<script>
const $=i=>document.getElementById(i),C=$('c'),X=C.getContext('2d'),W=270,H=480,HZ=130,GY=410,LW=62;C.width=W;C.height=H;
let S={};try{S=JSON.parse(localStorage.getItem('sp3')||'{}')}catch(e){}
S.coins=S.coins||0;S.best=S.best||0;S.ownS=S.ownS||['jake'];S.ownB=S.ownB||['basic'];S.skin=S.skin||'jake';S.board=S.board||'basic';
const save=()=>{try{localStorage.setItem('sp3',JSON.stringify(S))}catch(e){}};
// [name,price,[shirt,pants,skin,cap,pack]]
const SK={jake:['جيك',0,['#2f6fe0','#445','#f0b98a','#e63946','#ffd23f']],neon:['نيون',150,['#ff2bd6','#2b2bff','#f0b98a','#00f5d4','#fff']],ninja:['النينجا',300,['#222','#111','#e0b090','#c00','#666']],gold:['الذهبي',600,['#ffd23f','#c98a00','#f0b98a','#fff3a0','#a06a00']],robot:['الروبوت',1000,['#9aa7b5','#5b6775','#c7d1db','#00e0ff','#ff5d5d']]};
// [name,price,color,duration,magnet,double,desc]
const BD={basic:['الكلاسيكي',0,'#4cc9f0',20,0,0,'درع 20 ث'],flame:['اللهب',250,'#ff7b00',30,1,0,'درع 30 ث + مغناطيس'],ice:['الجليد',500,'#a0e8ff',30,0,1,'درع 30 ث + عملات ×2'],gold:['الذهبي',900,'#ffd23f',40,1,1,'درع 40 ث + مغناطيس + ×2']};
const PD={mag:['M','#e33',10],jet:['J','#fa0',6],sn:['S','#3c3',12],x2:['×2','#38f',15]};
// audio
let AC,mute=false;
function snd(f,d,t='square',v=.07,e=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(e)o.frequency.exponentialRampToValueAtTime(e,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
const MN=[220,0,220,262,0,330,294,0,196,0,196,247,0,294,262,0];let ms=0;
setInterval(()=>{if(state=='play'&&!G.dead){const n=MN[ms++%16];if(n){snd(n/2,.14,'triangle',.1);snd(n*2,.05,'square',.015)}else snd(8000,.03,'square',.01)}},135);
// state
let G,state='menu',tab='s';
function reset(){G={z:0,x:0,tl:1,h:0,vy:0,roll:0,sp:22,t:0,score:0,coins:0,ob:[],nx:20,pw:{mag:0,jet:0,sn:0,x2:0},hb:0,hbCd:0,inv:0,dead:0,shake:0,fx:[],dt:0}}
reset();
const ob=(l,k,z,len,e)=>G.ob.push(Object.assign({l,k,z,len:len||1},e));
function seg(){const z=80,f=Math.random()*3|0,jet=G.pw.jet>0;
 for(let l=0;l<3;l++)if(l!=f&&Math.random()<.75){const r=Math.random();if(r<.4)ob(l,'T',z,6+(Math.random()*4|0),{c:Math.random()*4|0});else if(r<.7)ob(l,'L',z);else ob(l,'H',z)}
 const arc=Math.random()<.4,n=6;
 for(const l of jet?[0,1,2]:[f])for(let i=0;i<n;i++)ob(l,'c',z+i*3,0,{h:jet?85:arc?10+Math.sin(i/(n-1)*Math.PI)*50:10});
 if(Math.random()<.1)ob(f,'p',z+20,0,{h:20,p:['mag','jet','sn','x2'][Math.random()*4|0]});
 G.nx=24+Math.random()*8}
function fx(x,y,c,n,s){for(let i=0;i<n;i++)G.fx.push({x,y,vx:(Math.random()-.5)*s,vy:(Math.random()-.8)*s,l:.4+Math.random()*.4,c})}
function crash(o){const g=G;if(g.hb>0){g.hb=0;g.hbCd=10;g.inv=1.5;g.shake=1;o.dead=1;snd(150,.4,'sawtooth',.15,40);fx(W/2+g.x*LW,GY-g.h-10,BD[S.board][2],25,120)}
 else{g.dead=1;g.shake=1.2;snd(200,.7,'sawtooth',.18,30);fx(W/2+g.x*LW,GY-g.h-15,'#fff',30,150);setTimeout(over,1000)}}
function upd(dt){const g=G;g.t+=dt;g.sp=Math.min(22+g.t*.35,46);const v=g.sp*dt;g.z+=v;g.score+=v*(g.pw.x2>0?2:1)*.6;
 for(const k in g.pw)if(g.pw[k]>0){g.pw[k]-=dt;if(k=='jet'&&g.pw[k]<=0)g.inv=1.2}
 if(g.hb>0){g.hb-=dt;if(g.hb<=0)g.hbCd=10}else if(g.hbCd>0)g.hbCd-=dt;
 g.inv-=dt;g.roll-=dt;g.x+=(g.tl-1-g.x)*Math.min(1,dt*14);
 const jet=g.pw.jet>0;
 if(jet){g.h+=(95-g.h)*Math.min(1,dt*4);g.vy=0;if(Math.random()<.6)fx(W/2+g.x*LW,GY-g.h-8,Math.random()<.5?'#ff8a00':'#ffe066',1,60)}
 else{g.vy-=330*dt;g.h+=g.vy*dt;if(g.h<=0){g.h=0;g.vy=0;if(Math.random()<.3)fx(W/2+g.x*LW,GY,'#888',1,40)}}
 g.nx-=v;if(g.nx<=0)seg();
 const bd=BD[S.board],mag=g.pw.mag>0||(g.hb>0&&bd[4]),dbl=(g.pw.x2>0?2:1)*(g.hb>0&&bd[5]?2:1);
 const y0=g.h,y1=g.h+(g.roll>0&&g.h<1?18:38),pl=g.x+1;
 for(const o of g.ob){o.z-=v;if(o.dead)continue;
  if(o.k=='c'||o.k=='p'){
   if(mag&&o.k=='c'&&o.z<28&&o.z>-2)o.l+=(pl-o.l)*Math.min(1,dt*10);
   if(Math.abs(o.l-pl)<.55&&o.z<1.5&&o.z>-1.5&&o.h>y0-8&&o.h<y1+8){o.dead=1;
    if(o.k=='c'){g.coins+=dbl;g.cb=(g.cb||0)+1;snd(900+(g.cb%8)*70,.08,'square',.06);fx(W/2+(o.l-1)*LW,GY-o.h,'#ffd23f',4,60)}
    else{g.pw[o.p]=PD[o.p][2];snd(500,.3,'square',.09,1500);fx(W/2+g.x*LW,GY-g.h-20,PD[o.p][1],14,90)}}
  }else if(!jet&&g.inv<=0&&Math.abs(o.l-pl)<.6&&o.z<1&&o.z+o.len>-1){
   const r=o.k=='T'?[0,72]:o.k=='L'?[0,16]:[24,50];if(y0<r[1]&&y1>r[0])crash(o)}}
 g.ob=g.ob.filter(o=>!o.dead&&o.z+o.len>-6)}
function fxu(dt){G.shake-=dt*2;for(const p of G.fx){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}G.fx=G.fx.filter(p=>p.l>0)}
// controls
const lane=d=>{if(state=='play'&&!G.dead){const n=Math.max(0,Math.min(2,G.tl+d));if(n!=G.tl){G.tl=n;snd(300,.08,'triangle',.07,500)}}};
function jump(){if(state!='play'||G.dead||G.pw.jet>0)return;if(G.h<=.5){G.vy=G.pw.sn>0?290:195;G.roll=0;snd(350,.2,'square',.07,900)}}
function roll(){if(state!='play'||G.dead)return;if(G.h<=.5){G.roll=.6;snd(250,.2,'sawtooth',.06,100)}else G.vy=-380}
function board(){if(state!='play'||G.dead||G.hb>0||G.hbCd>0)return;G.hb=BD[S.board][3];snd(300,.4,'sine',.1,1200);fx(W/2+G.x*LW,GY,BD[S.board][2],20,100)}
function pause(){if(state=='play'){state='pause';$('paus').style.display='flex'}else if(state=='pause'){state='play';$('paus').style.display='none'}}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='arrowleft'||k=='a')lane(-1);else if(k=='arrowright'||k=='d')lane(1);else if(k=='arrowup'||k=='w'||k==' ')jump();else if(k=='arrowdown'||k=='s')roll();else if(k=='h')board();else if(k=='p'||k=='escape')pause();if(k.startsWith('arrow')||k==' ')e.preventDefault()});
let tx,ty;$('w').addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY});
$('w').addEventListener('pointerup',e=>{if(tx==null)return;const dx=e.clientX-tx,dy=e.clientY-ty;if(Math.max(Math.abs(dx),Math.abs(dy))>25){if(Math.abs(dx)>Math.abs(dy))lane(dx>0?1:-1);else dy<0?jump():roll()}tx=null});
// screens
const show=(id,v)=>$(id).style.display=v?'flex':'none';
function menu(){show('over',0);show('store',0);show('menu',1);$('mi').innerHTML='🏆 أفضل نتيجة: '+Math.floor(S.best)+'<br>🪙 '+S.coins;$('hbb').style.display=$('pz').style.display='none'}
function toMenu(){state='menu';show('paus',0);reset();menu()}
function play(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume();reset();state='play';['menu','store','over','paus'].forEach(i=>show(i,0));$('hbb').style.display=$('pz').style.display='block'}
function over(){state='over';S.coins+=G.coins;S.best=Math.max(S.best,G.score);save();$('hbb').style.display=$('pz').style.display='none';
 $('over').innerHTML=`<h2>انتهت اللعبة!</h2><div>النتيجة: ${Math.floor(G.score)}<br>🪙 +${G.coins} (المجموع ${S.coins})<br>🏆 الأفضل: ${Math.floor(S.best)}</div><button onclick="play()">↻ العب مجدداً</button><button onclick="openStore()">🛒 المتجر</button><button onclick="toMenu()">القائمة</button>`;show('over',1)}
function openStore(){show('menu',0);show('over',0);show('store',1);store()}
function store(){const sk=tab=='s',D=sk?SK:BD,own=sk?S.ownS:S.ownB,cur=sk?S.skin:S.board;
 let h=`<h2>🛒 المتجر</h2><div>🪙 ${S.coins}</div><div><button onclick="tab='s';store()" ${sk?'disabled':''}>السكنات</button> <button onclick="tab='b';store()" ${sk?'':'disabled'}>ألواح التزلج</button></div><div class="gr">`;
 for(const k in D){const d=D[k],o=own.includes(k);
  const pv=sk?'<div class="sw">'+d[2].map(c=>`<i style="background:${c}"></i>`).join('')+'</div>':`<div style="width:22cqw;height:3cqw;background:${d[2]}"></div><small>${d[6]}</small>`;
  h+=`<div class="it ${cur==k?'on':''}"><b>${d[0]}</b>${pv}<button onclick="buy('${k}')" ${cur==k?'disabled':''}>${cur==k?'مُجهّز ✓':o?'تجهيز':'شراء 🪙'+d[1]}</button></div>`}
 $('store').innerHTML=h+`</div><button onclick="${state=='over'?'over()':'menu()'}">رجوع</button>`}
function buy(k){const sk=tab=='s',D=sk?SK:BD,own=sk?S.ownS:S.ownB;
 if(!own.includes(k)){if(S.coins<D[k][1]){snd(150,.3,'sawtooth',.1);return}S.coins-=D[k][1];own.push(k);snd(600,.3,'square',.1,1800)}
 if(sk)S.skin=k;else S.board=k;save();store()}
// drawing
const R=(x,y,w,h,c)=>{X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)))};
const P=z=>1/(1+z*.055),gy=s=>HZ+(GY-HZ)*s;
function Q(p,c){X.fillStyle=c;X.beginPath();X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.fill()}
function T(t,x,y,c='#fff'){X.fillStyle='#000';X.fillText(t,x+1,y+1);X.fillStyle=c;X.fillText(t,x,y)}
const BC=['#d63a3a','#2f8f5b','#e0a020','#3a6fd8'];
function scene(){const g=G;
 const sk=['#1a1040','#2d1b69','#52308f','#8a3f9c','#c9559a','#f08080','#ffb26b','#ffd9a0'];
 for(let i=0;i<8;i++)R(-5,i*HZ/8,W+10,HZ/8+1,sk[i]);
 for(let i=0;i<30;i++)if(((g.t*2+i)|0)%5)R((i*53)%W,(i*29)%60,1,1,'#fff');
 for(let d=-11;d<=11;d++)R(205-Math.sqrt(121-d*d),95+d,Math.sqrt(121-d*d)*2,1,'#ffe8a0');
 for(let i=0;i<22;i++){const x=(((i*23-g.x*8-g.z*.2)%(W+30))+W+30)%(W+30)-15,bh=20+(i*37%40);R(x,HZ-bh,18,bh,'#2a1a55');for(let j=0;j<bh-6;j+=6)if((i+j)%3)R(x+3+(j%12),HZ-bh+4+j,2,2,'#ffd27a')}
 for(let y=HZ;y<H;y++){const s=(y-HZ)/(GY-HZ);if(s<.01)continue;const z=(1/s-1)/.055,ph=((z+g.z)/3)%1<.45;R(0,y,W,1,'#363644');
  for(let l=-1;l<=1;l++){const cx=W/2+l*LW*s,hw=LW*.42*s;R(cx-hw,y,hw*2,1,ph?'#6a4a2c':'#2f2f3a');R(cx-hw*.7,y,Math.max(1,2.2*s),1,'#cfd3dc');R(cx+hw*.7,y,Math.max(1,2.2*s),1,'#cfd3dc')}}
 // side buildings
 const base=Math.floor(g.z/9);
 for(let k=12;k>=0;k--){const z=k*9-(g.z%9),s=P(z),id=base+k;if(s>1.3)continue;
  for(const sd of[-1,1]){const w=46*s,h=(70+((id*7+(sd>0?3:0))%4)*35)*s,x=W/2+sd*(2.5*LW*s)+(sd<0?-w:0),y=gy(s)-h;
   R(x,y,w,h,['#3b2a6b','#2a3f6b','#523a6b','#2a2a4a'][(id+(sd>0))%4]);
   for(let a=4;a<h-4;a+=7*s+3)for(let b=3;b<w-4;b+=7*s+3)if((a*3+b*5+id)%7>2)R(x+b,y+a,3*s+1,3*s+1,'#ffd27a')}}
 R(0,HZ-2,W,4,'#ffd9a055')}
function entity(o){const s=P(o.z),sx=W/2+(o.l-1)*LW*s,sy=gy(s);if(s>1.4||s<.05)return;
 if(o.k=='T'){const s2=P(o.z+o.len),sy2=gy(s2),sx2=W/2+(o.l-1)*LW*s2,w=28*s,w2=28*s2,h=72*s,h2=72*s2,col=BC[o.c];
  Q([sx-w,sy-h,sx+w,sy-h,sx2+w2,sy2-h2,sx2-w2,sy2-h2],'#ccd');
  const side=sx<W/2?1:-1;Q([sx+w*side,sy,sx+w*side,sy-h,sx2+w2*side,sy2-h2,sx2+w2*side,sy2],'#0004');
  R(sx-w,sy-h,w*2,h,col);R(sx-w,sy-h*.35,w*2,h*.12,'#fff');R(sx-w,sy-h*.2,w*2,h*.2,'#0005');
  R(sx-w*.8,sy-h*.9,w*.7,h*.35,'#bfe8ff');R(sx+w*.1,sy-h*.9,w*.7,h*.35,'#bfe8ff');R(sx-w*.7,sy-h*.2,w*.3,h*.1,'#ffe066');R(sx+w*.4,sy-h*.2,w*.3,h*.1,'#ffe066')}
 else if(o.k=='L'){const w=27*s;R(sx-w,sy-16*s,3*s+1,16*s,'#444');R(sx+w-3*s,sy-16*s,3*s+1,16*s,'#444');for(let i=0;i<6;i++)R(sx-w+i*w/3,sy-16*s,w/3,8*s,i%2?'#fff':'#f60')}
 else if(o.k=='H'){const w=27*s;R(sx-w,sy-50*s,3*s+1,50*s,'#444');R(sx+w-3*s,sy-50*s,3*s+1,50*s,'#444');for(let i=0;i<6;i++)R(sx-w+i*w/3,sy-50*s,w/3,26*s,i%2?'#fff':'#d22')}
 else if(o.k=='c'){const w=Math.abs(Math.cos(G.t*6+o.z*.3))*8*s+2,h=9*s,y=sy-o.h*s-h;R(sx-w/2-1,y-1,w+2,h+2,'#a06a00');R(sx-w/2,y,w,h,'#ffd23f');R(sx-w/4,y+h*.2,Math.max(1,w/4),h*.5,'#fff3a0')}
 else{const w=14*s,y=sy-o.h*s-w*1.5,d=PD[o.p];R(sx-w/2-1,y-1,w+2,w+2,'#fff');R(sx-w/2,y,w,w,d[1]);X.font=`bold ${Math.max(5,9*s)|0}px monospace`;X.textAlign='center';X.fillStyle='#fff';X.fillText(d[0],sx,y+w*.78)}}
function player(){const g=G,k=SK[S.skin][2],x=W/2+g.x*LW,B=g.hb>0,y=GY-g.h-(B?4:0);
 R(x-9+g.h/20,GY+1,18-g.h/10,3,'#0006');
 if(g.inv>0&&((g.t*20)|0)%2)return;
 if(B){R(x-13,y,26,4,BD[S.board][2]);R(x-10,y+4,20,1,'#fff6');if(g.t*30%2<1)R(x-13+Math.random()*26,y+5,2,2,BD[S.board][2])}
 if(g.roll>0&&g.h<1){const f=((g.t*24)|0)%4;R(x-8,y-16,16,16,k[0]);R(x-8,y-(f%2?16:8),16,8,k[1]);R(x-4,y-14+f*2,8,6,k[3]);return}
 const sw=Math.sin(g.t*16)*4,air=g.h>2,la=air?0:Math.max(0,sw),lb=air?0:Math.max(0,-sw),sc=g.pw.sn>0?'#3f3':'#eee';
 R(x-5,y-12,4,12-la,k[1]);R(x+1,y-12,4,12-lb,k[1]);R(x-6,y-3-la,5,3,sc);R(x+1,y-3-lb,5,3,sc);
